<!-- OPENING SCREEN—the room opener.
     AUDIENCE: engineers at a hackathon whose day job is building interfaces for customers who do
     not trust them. The question has to be one THEY have lived, not one about construction finance.
     So it opens on the thing every one of them has shipped: a confidence number nobody could defend.

     KINETIC, NOT DECORATIVE. Every beat is Agave's own motion vocabulary, measured off their site:
     .2s, cubic-bezier(.075,.82,.165,1), 90ms stagger, the field-fill cascade, the drawn flow line,
     and the 7s linear progress bar from their auto-advancing feature tabs.

     DRIVEN BY KEYS, LIKE THE DECK: N forward, B backward, SPACE pauses the auto-advance.
     Beats are `data-beat`, deliberately NOT `data-state`—this is a presentation, not a product
     screen, and design-loop's state-matrix must not read these as UI states it should gate. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hands up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="agave.css">

<style>
  html,body{height:100%}
  body{background:var(--ag-navy);overflow:hidden}

  .stage{position:fixed;inset:0;display:grid;place-items:center;padding:4vmin 6vmin}
  .stage::before{ /* Agave's diagonal hatch, in the margins */
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 1px,transparent 1px 9px);
    mask-image:linear-gradient(90deg,#000 0 12%,transparent 18% 82%,#000 88% 100%);
    -webkit-mask-image:linear-gradient(90deg,#000 0 12%,transparent 18% 82%,#000 88% 100%);
  }

  .beat{display:none;width:100%;max-width:66rem;position:relative;z-index:1}
  .beat[data-on]{display:block}

  /* ── KINETIC TYPE ───────────────────────────────────────────────────────
     A line is a stack of masked rows. Each row's inner span starts pushed fully below its own
     mask and rises into place—the type appears to be dealt rather than faded. Agave's easing
     does the work: fast departure, long soft landing. */
  .kin{display:block;overflow:hidden;line-height:.94}
  /* A line of display type is a NARRATIVE beat, not a hover response. .42s with a 90ms
     stagger read as one simultaneous flash from more than a metre away. */
  .kin > span{display:block;transform:translateY(105%);
    animation:kinUp .75s var(--ag-ease) forwards}
  @keyframes kinUp{to{transform:translateY(0)}}
  .beat[data-on] .kin:nth-of-type(1) > span{animation-delay:.05s}
  .beat[data-on] .kin:nth-of-type(2) > span{animation-delay:.30s}
  .beat[data-on] .kin:nth-of-type(3) > span{animation-delay:.55s}
  .beat[data-on] .kin:nth-of-type(4) > span{animation-delay:.80s}

  .xxl{font-size:clamp(3.2rem,13vw,11rem);font-weight:600;letter-spacing:-.04em;margin:0}
  .xl {font-size:clamp(2rem,6.4vw,5rem);font-weight:600;letter-spacing:-.03em;margin:0}
  .md {font-size:clamp(1.05rem,2.4vw,1.9rem);font-weight:400;letter-spacing:-.01em;
       color:var(--ag-ink-dark-mid);margin:0}
  .green{color:var(--ag-green)}
  .lime{color:var(--ag-lime)}

  .lede{margin-top:1.6rem;opacity:0;animation:agIn .6s var(--ag-ease) 1.15s forwards}
  .lede--late{animation-delay:2.1s}

  .rows{width:min(30rem,100%);border-top:1px solid var(--ag-line-dark)}
  .row{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;
    padding:.6rem 0;border-bottom:1px solid var(--ag-line-dark);
    font-family:var(--ag-mono);font-size:clamp(.72rem,1.35vw,.95rem)}
  .row__k{color:var(--ag-ink-dark-mid);letter-spacing:.04em}
  .row__v{display:flex;align-items:center;gap:.5rem}
  .tick{width:5.5rem;height:.5rem;background:var(--ag-green);transform-origin:left center;
    transform:scaleX(0);animation:agBar .28s var(--ag-ease) forwards}
  .tick--never{background:repeating-linear-gradient(45deg,
      var(--ag-unknown) 0 2px,transparent 2px 5px);outline:1px solid var(--ag-unknown)}
  .row--never .row__k{color:var(--ag-ink-dark)}
  .lbl{font-size:.72em;letter-spacing:.1em;text-transform:uppercase}
  .lbl--ran{color:var(--ag-green)}
  .lbl--never{color:var(--ag-ink-dark-mid)}

  /* ── CHROME ─────────────────────────────────────────────────────────────── */
  .hud{position:fixed;left:0;right:0;bottom:0;z-index:3;
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:.9rem 1.4rem;border-top:1px solid var(--ag-line-dark);
    background:linear-gradient(to top,rgba(5,15,29,.92),rgba(5,15,29,0))}
  .keys{display:flex;gap:.45rem;align-items:center;font-family:var(--ag-mono);
    font-size:var(--ag-t-micro);color:var(--ag-ink-dark-mute);letter-spacing:.06em}
  kbd{font-family:var(--ag-mono);font-size:.95em;border:1px solid var(--ag-line-dark-2);
    padding:.12rem .42rem;color:var(--ag-ink-dark-mid);background:rgba(255,255,255,.04)}
  .dots{display:flex;gap:.4rem}
  .dot{width:1.6rem;height:2px;background:var(--ag-line-dark-2);border:0;padding:0;cursor:pointer}
  .dot[aria-current="true"]{background:var(--ag-green)}
  .bar{position:fixed;top:0;left:0;right:0;height:2px;background:transparent;z-index:3}
  .bar__f{height:100%;background:var(--ag-green);transform-origin:left center;transform:scaleX(0)}
  .bar__f[data-run]{animation:agProgress 7s linear forwards}

  .mark{position:fixed;top:1.1rem;left:1.4rem;z-index:3;display:flex;align-items:center;gap:.55rem;
    font-family:var(--ag-mono);font-size:var(--ag-t-micro);letter-spacing:.14em;
    text-transform:uppercase;color:var(--ag-ink-dark-mute)}
  .mark__d{width:.45rem;height:.45rem;background:var(--ag-green)}

  @media (prefers-reduced-motion:reduce){
    .kin > span{transform:none!important}
    .lede{opacity:1!important}
    .tick{transform:scaleX(1)!important}
    .score__n--struck::after{transform:scaleX(1)!important}
    .bar__f[data-run]{animation:none!important;transform:scaleX(1)!important}
  }
</style>

<div class="mark"><span class="mark__d" aria-hidden="true"></span><span>Redline</span></div>
<div class="bar"><div class="bar__f" id="bar"></div></div>

<main class="stage">

  <!-- BEAT 1 · the hand-raise. Two words, the full width of the room. -->
  <section class="beat" data-beat="1" data-on>
    <h1 class="xxl"><span class="kin"><span>HANDS UP</span></span></h1>
    <p class="md lede">if you have ever shipped a number
      <em style="font-style:normal" class="lime">you could not defend.</em></p>
  </section>

  <!-- BEAT 2 · name the thing they all recognise. -->
  <section class="beat" data-beat="2">
    <h2 class="xl">
      <span class="kin"><span>Your pipeline returned</span></span>
      <span class="kin"><span class="green">200 OK.</span></span>
      <span class="kin"><span>Did it actually</span></span>
      <span class="kin"><span>check anything?</span></span>
    </h2>
    <p class="md lede lede--late">Every one of us has watched a green tick mean
      <em style="font-style:normal">“nothing threw”</em> rather than
      <em style="font-style:normal">“I verified it”</em>.</p>
  </section>




</main>

<div class="hud">
  <div class="keys">
    <kbd>N</kbd><span>next</span><kbd>B</kbd><span>back</span><kbd>space</kbd><span id="pl">pause</span>
  </div>
  <div class="dots" id="dots" role="tablist" aria-label="beats"></div>
</div>

<script>
/* THE VIEWER SETS THE PACE. Auto-advance is a convenience, not the mechanism: any key press stops
   it, because a room asks questions and a deck that keeps moving through them is worse than one
   that never moved. SPACE resumes. */
(function () {
  var beats = [].slice.call(document.querySelectorAll('.beat'));
  var bar   = document.getElementById('bar');
  var dots  = document.getElementById('dots');
  var pl    = document.getElementById('pl');
  var i = 0, timer = null, playing = true;
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  beats.forEach(function (_, n) {
    var b = document.createElement('button');
    b.className = 'dot'; b.setAttribute('role', 'tab');
    b.setAttribute('aria-label', 'beat ' + (n + 1));
    b.addEventListener('click', function () { stop(); go(n); });
    dots.appendChild(b);
  });

  function paint() {
    beats.forEach(function (el, n) {
      if (n === i) el.setAttribute('data-on', ''); else el.removeAttribute('data-on');
    });
    [].forEach.call(dots.children, function (d, n) {
      d.setAttribute('aria-current', n === i ? 'true' : 'false');
    });
    /* Restarting the CSS animation needs the node replaced—toggling a class does not retrigger. */
    bar.removeAttribute('data-run');
    void bar.offsetWidth;
    if (playing && !REDUCED) bar.setAttribute('data-run', '');
  }

  function go(n) {
    i = (n + beats.length) % beats.length;
    paint();
    if (playing) { clearTimeout(timer); timer = setTimeout(function () { go(i + 1); }, 7000); }
  }
  function stop() { playing = false; clearTimeout(timer); bar.removeAttribute('data-run'); pl.textContent = 'play'; }
  function start() { playing = true; pl.textContent = 'pause'; go(i); }

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'n' || k === 'arrowright') { stop(); go(i + 1); }
    else if (k === 'b' || k === 'arrowleft') { stop(); go(i - 1); }
    else if (e.code === 'Space' || k === ' ') { e.preventDefault(); playing ? stop() : start(); }
  });

  paint();
  if (!REDUCED) timer = setTimeout(function () { go(1); }, 7000); else stop();
})();
</script>
